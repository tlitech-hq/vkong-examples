<!doctype html><html><head><meta charset="utf-8"><script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.1.1/dist/model-viewer.min.js"></script><style>body{margin:0;padding:28px;background:#edf1f6;font-family:Arial,sans-serif;color:#182235}h1{margin:0 0 8px}p{margin:0 0 24px;color:#526173}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}figure{margin:0;padding:16px;background:white;border-radius:12px}figcaption{font-size:22px;font-weight:600;margin-bottom:8px}model-viewer{width:100%;height:530px;background:#e8edf3;border-radius:8px}</style></head><body><h1>VKong mascot · Hunyuan3D 2.1 · RTX 4090</h1><p>Actual textured GLB · seed 1234 · 30 shape steps · texture 512 / six views</p><div class="grid"><figure id="front"><figcaption>Front</figcaption><model-viewer src="textured.glb" camera-orbit="0deg 90deg 3.5m" camera-target="0m 0m 0m" field-of-view="35deg" environment-image="neutral" shadow-intensity="0.6" exposure="1"></model-viewer></figure><figure id="front-left"><figcaption>Front left</figcaption><model-viewer src="textured.glb" camera-orbit="-35deg 75deg 3.8m" camera-target="0m 0m 0m" field-of-view="35deg" environment-image="neutral" shadow-intensity="0.6" exposure="1"></model-viewer></figure><figure id="front-right"><figcaption>Front right</figcaption><model-viewer src="textured.glb" camera-orbit="35deg 75deg 3.8m" camera-target="0m 0m 0m" field-of-view="35deg" environment-image="neutral" shadow-intensity="0.6" exposure="1"></model-viewer></figure><figure id="left"><figcaption>Left</figcaption><model-viewer src="textured.glb" camera-orbit="-90deg 80deg 3.8m" camera-target="0m 0m 0m" field-of-view="35deg" environment-image="neutral" shadow-intensity="0.6" exposure="1"></model-viewer></figure><figure id="right"><figcaption>Right</figcaption><model-viewer src="textured.glb" camera-orbit="90deg 80deg 3.8m" camera-target="0m 0m 0m" field-of-view="35deg" environment-image="neutral" shadow-intensity="0.6" exposure="1"></model-viewer></figure><figure id="back"><figcaption>Back</figcaption><model-viewer src="textured.glb" camera-orbit="180deg 80deg 3.8m" camera-target="0m 0m 0m" field-of-view="35deg" environment-image="neutral" shadow-intensity="0.6" exposure="1"></model-viewer></figure></div></body></html>
