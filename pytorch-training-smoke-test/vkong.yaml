# App
type: task
app: pytorch-training-smoke-test

# Compute
gpu: Any
num_gpus: 1
min_cpu_cores: 4
min_ram_gb: 8
disk_gb: 16

# Budget
# vkong dev quotes about $1.56/hour; for vkong run only, max_price: 1.0 is enough.
max_price: 2.0
verified_only: true

# Runtime
image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
init_cmd: python3 -m pip install 'torchvision==0.22.1'
start: python3 train.py
