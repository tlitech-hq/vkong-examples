# App
type: task
app: sdxl-image-generation

# Compute
gpu: RTX-4090
num_gpus: 1
min_cpu_cores: 4
min_ram_gb: 16
disk_gb: 32

# Budget
# vkong dev quotes about $1.76/hour; for vkong run only, max_price: 1.5 is enough.
max_price: 2.0
verified_only: true

# Runtime
image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
init_cmd: python3 -m pip install -r requirements.txt
start: python3 generate.py
