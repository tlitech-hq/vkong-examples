# App
type: service
app: mobilenetv2-triton
app_port: 8000

# Compute
gpu: RTX-4090
num_gpus: 1
min_cpu_cores: 4
min_ram_gb: 16
disk_gb: 40

# Budget
max_price: 2.5
verified_only: true

# Runtime
image: nvcr.io/nvidia/tritonserver:26.07-py3
init_cmd: |
  set -e
  python3 -m pip install huggingface_hub
  python3 prepare_model.py
start: >-
  exec /opt/tritonserver/bin/tritonserver
  --model-repository=models --http-port "$PORT"
  --grpc-port 8001 --metrics-port 8002
