# App: two vLLM machines behind one VKong URL.
type: service
app: vllm-stack
app_port: 8000
min_instances: 2
max_instances: 2
health:
  path: /health
# The first start downloads the model (about 8 GB) before vLLM answers.
startup_timeout: 30m

# Compute
gpu: RTX-4090
num_gpus: 1
min_cpu_cores: 8
min_ram_gb: 32
disk_gb: 60

# Budget
max_price: 1.0
verified_only: true

# vllm-stack: VLLM_API_KEY. grafana: METRICS_WRITE_URL, METRICS_USER and
# METRICS_PASSWORD for Grafana Cloud (README steps 1 and 2).
secrets:
  - vllm-stack
  - grafana

# Runtime
image: vllm/vllm-openai:v0.32.0
start: exec bash serve.sh
