# App
type: task
app: smollm2-unsloth-finetuning

# Compute
gpu: Any
num_gpus: 1
cpu_cores: 4
ram_gb: 16
disk_gb: 82
inet_down_mbps: 100

# Budget
max_dph: 0.60
verified_only: true

# Storage
storage:
  volume: unsloth-smollm2-lab  # mounted at /vkong/storage/unsloth-smollm2-lab

# Runtime
image: unsloth/unsloth:core-nightly-2026.09.18
start_argv:
  - python3
  - train.py
