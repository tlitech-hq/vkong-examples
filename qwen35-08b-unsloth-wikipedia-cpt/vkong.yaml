# App
type: task
app: qwen35-08b-unsloth-wikipedia-cpt

# Compute
gpu: RTX-4090
num_gpus: 1
min_cpu_cores: 8
min_ram_gb: 32
disk_gb: 120           # 11.6 GB dataset, model, caches, checkpoints and the image

# Budget
max_price: 0.60
verified_only: true

# Storage: the dataset and the checkpoints live in this one volume.
storage:
  volume: unsloth-wiki-lab  # mounted at /vkong/storage/unsloth-wiki-lab

# Runtime
image: unsloth/unsloth:core-nightly-2026.10.10
secrets: [huggingface]      # HF_TOKEN for fast, authenticated downloads
start_argv:
  - python3
  - train.py
